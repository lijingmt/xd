services:
  # xiand 统一服务 - MUD + Tomcat Web 在同一容器内
  # 这样 JSP 可以直接通过 127.0.0.1:13800 连接到 Pike MUD
  xiand:
    image: lijingmt/xiand-all:latest
    container_name: xiand-${GAME_AREA:-xd01}
    pull_policy: always
    restart: unless-stopped
    # 最多 16 个 Worker 依次执行停流和原子存档时，禁止 Docker 提前 SIGKILL。
    stop_grace_period: 10m
    # 5 Worker + 协调器 + Tomcat 的生产实测会超过 6G；18G 为编译缓存和流量高峰留出余量。
    deploy:
      resources:
        limits:
          memory: 18G
        reservations:
          memory: 8G
    # 设置堆栈限制为无限，防止 Pike 编译大文件时栈溢出
    # 设置文件描述符限制，防止 "Too many open files" 错误
    ulimits:
      stack:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${MUD_PORT:-13800}:13800"
      - "${HTTP_API_PORT:-8888}:8888"
      - "${TOMCAT_HTTP_PORT:-9001}:8080"
      - "${TOMCAT_HTTPS_PORT:-8443}:8443"
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      # 持久化数据 - 映射到 /usr/local/games/allxd/xd01/ (对应区号)
      # 容器内 /app/xiand/data_xiand -> 宿主机 /usr/local/games/allxd/{GAME_AREA}/data_xiand
      # 所有分区共用同一套只读逻辑物品；默认与 restart-docker.sh 的同步目录一致。
      - /usr/local/games/allxd/${GAME_AREA:-xd01}/data_xiand:/app/xiand/data_xiand
      # 逻辑区配置与其他 etc 数据必须跨镜像、跨容器重建持久化。
      - /usr/local/games/allxd/${GAME_AREA:-xd01}/etc:/app/xiand/gamelib/etc
      - ${XIAND_SHARED_ITEM_DIR:-/usr/local/games/allxd/item}:/app/xiand/gamelib/clone/item
      # 日志输出 - 映射到 allxd/log 目录
      - /usr/local/games/allxd/log/${GAME_AREA:-xd01}:/app/xiand/log
      - /usr/local/games/allxd/log/${GAME_AREA:-xd01}/db_log:/app/xiand/db_log
    security_opt:
      # 禁用用户命名空间隔离以允许修改挂载卷的权限
      - label=disable
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # 时区配置 - 使用上海时区
      - TZ=Asia/Shanghai
      # MySQL 连接配置 - 使用 TCP 连接到本机 MySQL
      - MYSQL_HOST=${MYSQL_HOST:-172.17.0.1}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - XIAND_HEALTH_TOKEN=${XIAND_HEALTH_TOKEN:-}
      - XIAND_WORKER_TOKEN=${XIAND_WORKER_TOKEN}
      - XIAND_MAP_WORKER_ENABLED=${XIAND_MAP_WORKER_ENABLED:-1}
      - XIAND_MAP_WORKER_TRAFFIC_MODE=${XIAND_MAP_WORKER_TRAFFIC_MODE:-shadow}
      - XIAND_MAP_WORKER_COUNT=${XIAND_MAP_WORKER_COUNT:-3}
      - XIAND_MAP_WORKER_CAPACITY=${XIAND_MAP_WORKER_CAPACITY:-100}
      - XIAND_MAP_WORKER_ACTIVE_TRIAL_ACK=${XIAND_MAP_WORKER_ACTIVE_TRIAL_ACK:-}
      - XIAND_WORKER_CONTROL_TIMEOUT=${XIAND_WORKER_CONTROL_TIMEOUT:-4}
      # 留空时由 Pike 按总并发和实际 Worker 数量计算安全默认值。
      - XIAND_GATEWAY_MAX_REQUESTS=${XIAND_GATEWAY_MAX_REQUESTS:-}
      - XIAND_GATEWAY_MAX_REQUESTS_PER_WORKER=${XIAND_GATEWAY_MAX_REQUESTS_PER_WORKER:-}
      - MYSQL_DATABASE=${GAME_AREA:-xd01}
      # MUD 配置
      - MUD_PORT=${MUD_PORT:-13800}
      - DEBUG=0
      # 游戏区号和日志配置
      - GAME_AREA=${GAME_AREA:-xd01}
      - GAME_AREAS=${GAME_AREAS:-xd01,xd02,xd03,xd04,xd05}
      # Tomcat 配置
      - TOMCAT_HTTP_PORT=8080
      - TOMCAT_HTTPS_PORT=8443

# 不需要 MySQL 卷，使用本机 MySQL
