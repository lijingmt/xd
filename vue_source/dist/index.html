<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>仙道</title>
    <script>
    // 在样式表加载前恢复字号，避免进入游戏时先大后小的闪动。
    (function() {
        var supportedFontSizes = ['small', 'normal', 'large', 'xlarge'];
        var savedFontSize = 'small';
        try {
            savedFontSize = localStorage.getItem('mud_font_size') || 'small';
        } catch (error) {
            savedFontSize = 'small';
        }
        if (supportedFontSizes.indexOf(savedFontSize) === -1) {
            savedFontSize = 'small';
        }
        document.documentElement.setAttribute('data-font-size', savedFontSize);
    })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="vendor/driver.css?v=v1785611025462">
    <link rel="stylesheet" href="css/app.css?v=v1785611025462">
    <link rel="stylesheet" href="css/realm.css?v=v1785611025462">
</head>
<body>
    <div id="app">
        <!-- 登录弹窗 -->
        <div class="modal-overlay auth-overlay" v-if="showLogin">
            <div class="modal auth-modal" role="dialog" aria-labelledby="login-title">
                <div class="auth-brand" aria-hidden="true">
                    <div class="auth-brand-mark"><span>仙</span></div>
                    <div class="auth-brand-copy">
                        <div class="auth-eyebrow">东方幻想 · 多职业世界</div>
                        <h1 id="login-title">仙道</h1>
                        <p>一念入世，七职同行</p>
                    </div>
                </div>
                <div class="auth-feature-row" aria-label="游戏特色">
                    <span>七大职业</span>
                    <span>自由成长</span>
                    <span>随时开玩</span>
                </div>
                <div class="auth-form">
                    <div class="form-group">
                        <label for="login-partition">分区</label>
                        <select id="login-partition"
                                name="partition"
                                v-model="loginForm.partition"
                                class="form-select"
                                :disabled="partitionsLoading || isLoggingIn">
                            <option v-for="p in partitions"
                                    :key="p.value"
                                    :value="p.value"
                                    :disabled="p.login_open === 0">
                                {{ p.label }}{{ p.login_open === 0 ? '（维护中）' : '' }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="login-userid">账号</label>
                        <input id="login-userid"
                               name="username"
                               type="text"
                               v-model.trim="loginForm.userid"
                               placeholder="输入账号"
                               autocomplete="username"
                               autocapitalize="none"
                               spellcheck="false"
                               @keyup.enter="doLogin"
                               :disabled="isLoggingIn">
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <div class="password-field">
                            <input id="login-password"
                                   name="password"
                                   :type="loginPasswordVisible ? 'text' : 'password'"
                                   v-model="loginForm.password"
                                   placeholder="输入密码"
                                   autocomplete="current-password"
                                   @keyup.enter="doLogin"
                                   :disabled="isLoggingIn">
                            <button type="button"
                                    class="password-toggle"
                                    @click="loginPasswordVisible = !loginPasswordVisible"
                                    :aria-label="loginPasswordVisible ? '隐藏密码' : '显示密码'">
                                {{ loginPasswordVisible ? '隐藏' : '显示' }}
                            </button>
                        </div>
                    </div>
                    <button type="button"
                            class="btn btn-primary btn-block auth-submit"
                            aria-label="登录游戏"
                            @click="doLogin"
                            :disabled="isLoggingIn">
                        <span v-if="!isLoggingIn">🎮 登录游戏</span>
                        <span v-else class="loading">登录中...</span>
                    </button>
                </div>
                <div v-if="loginError"
                     class="message message-error auth-message"
                     role="alert"
                     aria-live="assertive">
                    {{ loginError }}
                </div>
                <div class="auth-secondary-actions">
                    <button type="button" class="auth-text-action primary" @click="openRegister">
                        创建新账号
                    </button>
                    <button type="button" class="auth-text-action" @click="toggleTheme">
                        {{ theme === 'classic' ? '切换暗色' : (theme === 'dark' ? '切换浅色' : '切换经典') }}
                    </button>
                    <button type="button" class="auth-text-action" @click="goToSelection">
                        新旧界面选择
                    </button>
                </div>
            </div>
        </div>

        <!-- 注册弹窗 -->
        <div class="modal-overlay auth-overlay" v-if="showRegister">
            <div class="modal auth-modal register-modal" role="dialog" aria-labelledby="register-title">
                <div class="auth-section-heading">
                    <div class="auth-section-icon" aria-hidden="true">启</div>
                    <div>
                        <div class="auth-eyebrow">建立你的仙途身份</div>
                        <h2 id="register-title">创建新账号</h2>
                    </div>
                </div>
                <form class="auth-form" @submit.prevent="doRegister">
                <div class="form-group">
                    <label for="register-partition">分区</label>
                    <select id="register-partition"
                            v-model="registerForm.partition"
                            class="form-select"
                            :disabled="partitionsLoading || isRegistering">
                        <option v-for="p in partitions"
                                :key="p.value"
                                :value="p.value"
                                :disabled="p.registration_open === 0">
                            {{ p.label }}{{ p.registration_open === 0 ? '（暂停注册）' : '' }}
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="register-userid">账号</label>
                    <input id="register-userid"
                           type="text"
                           v-model.trim="registerForm.userid"
                           placeholder="2-12位英文或数字"
                           maxlength="12"
                           autocomplete="username"
                           autocapitalize="none"
                           spellcheck="false"
                           :disabled="isRegistering">
                </div>
                <div class="form-group">
                    <label for="register-password">密码</label>
                    <div class="password-field">
                        <input id="register-password"
                               :type="registerPasswordVisible ? 'text' : 'password'"
                               v-model="registerForm.password"
                               placeholder="2-12位英文或数字"
                               maxlength="12"
                               autocomplete="new-password"
                               :disabled="isRegistering">
                        <button type="button"
                                class="password-toggle"
                                @click="registerPasswordVisible = !registerPasswordVisible"
                                :aria-label="registerPasswordVisible ? '隐藏密码' : '显示密码'">
                            {{ registerPasswordVisible ? '隐藏' : '显示' }}
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="register-password-confirm">确认密码</label>
                    <input id="register-password-confirm"
                           type="password"
                           v-model="registerForm.passwordConfirm"
                           placeholder="请再次输入密码"
                           maxlength="12"
                           autocomplete="new-password"
                           :disabled="isRegistering">
                </div>
                <div class="form-group">
                    <label for="register-captcha">验证码</label>
                    <div class="captcha-group">
                        <input id="register-captcha"
                               type="text"
                               v-model.trim="registerForm.captcha"
                               placeholder="输入验证码"
                               maxlength="4"
                               class="form-control"
                               autocomplete="off"
                               :disabled="isRegistering">
                        <button type="button"
                                class="captcha-display"
                                @click="refreshCaptcha"
                                aria-label="刷新验证码">
                            {{ captchaCode }}
                        </button>
                    </div>
                </div>
                <button type="submit"
                        class="btn btn-primary btn-block auth-submit"
                        :disabled="isRegistering">
                    <span v-if="!isRegistering">创建账号</span>
                    <span v-else class="loading">正在创建...</span>
                </button>
                </form>
                <div v-if="registerError"
                     class="message message-error auth-message"
                     role="alert"
                     aria-live="assertive">
                    {{ registerError }}
                </div>
                <div v-if="registerSuccess"
                     class="message message-success auth-message"
                     role="status"
                     aria-live="polite">
                    注册成功，请返回登录
                </div>
                <div class="auth-secondary-actions">
                    <button type="button" class="auth-text-action primary" @click="closeRegister">
                        返回登录
                    </button>
                    <button type="button" class="auth-text-action" @click="toggleTheme">
                        切换主题
                    </button>
                    <button type="button" class="auth-text-action" @click="goToSelection">
                        新旧界面选择
                    </button>
                </div>
            </div>
        </div>

        <!-- 游戏主界面 - 使用iframe显示原始HTML -->
        <template v-if="!showLogin && !showRegister">
            <!-- 顶部状态栏 -->
            <header class="game-header" aria-label="人物状态" data-tour="player-header">
                <button type="button"
                     class="player-avatar-shell"
                     data-tour="player-avatar"
                     :class="playerStats?.profession_assistant?.style_class || 'profession-style-none'"
                     @click="sendQuickCommand(playerStats?.profession_assistant?.supported ? 'profession_assistant' : 'myhp')"
                     :title="playerStats?.profession_assistant?.supported ? '打开' + playerStats.profession_assistant.name : (playerStats && playerStats.name_cn ? playerStats.name_cn + '的头像' : '人物头像')">
                    <img v-if="playerAvatarUrl && !playerAvatarFailed"
                         :src="playerAvatarUrl"
                         :alt="playerStats && playerStats.name_cn ? playerStats.name_cn + '的头像' : '人物头像'"
                         class="player-avatar-image"
                         @error="handlePlayerAvatarError">
                    <span v-else
                          class="player-avatar-fallback"
                          role="img"
                          aria-label="人物头像">{{ playerAvatarFallback }}</span>
                </button>
                <div class="player-info">
                    <div class="player-info-line">
                        <span class="player-fullid">{{ loginForm.userid }}</span>
                        <span class="divider">·</span>
                        <span class="player-name-cn" v-if="playerStats && playerStats.name_cn">{{ playerStats.name_cn }}</span>
                        <button type="button"
                                v-if="playerStats?.profession_assistant?.supported"
                                class="profession-assistant-badge"
                                data-tour="profession-assistant"
                                :class="{ active: playerStats.profession_assistant.level > 0 }"
                                @click="sendQuickCommand('profession_assistant')"
                                :title="playerStats.profession_assistant.level_label">
                            {{ playerStats.profession_assistant.title }} · {{ playerStats.profession_assistant.level > 0 ? '助手' + playerStats.profession_assistant.level : '可试用' }}
                        </button>
                        <span class="divider" v-if="playerStats && playerStats.name_cn">·</span>
                        <span class="server-info">{{ areaName }}</span>
                        <button type="button"
                                class="autofight-status-text"
                                :class="{ active: playerStats && playerStats.autofight }"
                                @click="toggleAutofight"
                                :title="playerStats && playerStats.autofight ? '点击停止自动挂机' : '点击开始自动挂机'">
                            {{ playerStats && playerStats.autofight
                                ? '● 挂机中 ' + formatAutofightTime(playerStats.autofight_time_left)
                                : '▷ 自动挂机' }}
                        </button>
                    </div>
                    <!-- 玩家状态信息 - 血槽显示 -->
                    <div class="player-stats" v-if="playerStats" data-tour="player-stats">
                        <div class="stat-bar"
                             role="progressbar"
                             aria-label="生命"
                             aria-valuemin="0"
                             :aria-valuemax="playerStats.hp_max || 0"
                             :aria-valuenow="playerStats.hp || 0">
                            <span class="stat-label">生命</span>
                            <div class="bar-container">
                                <div class="bar-fill hp-bar"
                                     :style="{ width: getStatPercent(playerStats.hp, playerStats.hp_max) + '%' }"></div>
                            </div>
                            <span class="stat-value">{{ formatCompactNumber(playerStats.hp) }}</span>
                        </div>
                        <div class="stat-bar"
                             role="progressbar"
                             aria-label="法力"
                             aria-valuemin="0"
                             :aria-valuemax="playerStats.mana_max || 0"
                             :aria-valuenow="playerStats.mana || 0">
                            <span class="stat-label">法力</span>
                            <div class="bar-container">
                                <div class="bar-fill mana-bar"
                                     :style="{ width: getStatPercent(playerStats.mana, playerStats.mana_max) + '%' }"></div>
                            </div>
                            <span class="stat-value">{{ formatCompactNumber(playerStats.mana) }}</span>
                        </div>
                        <div class="stat-bar"
                             role="progressbar"
                             aria-label="精力"
                             aria-valuemin="0"
                             aria-valuemax="100"
                             :aria-valuenow="Math.min(100, Math.max(0, Number(playerStats.energy) || 0))">
                            <span class="stat-label">精力</span>
                            <div class="bar-container">
                                <div class="bar-fill energy-bar"
                                     :style="{ width: Math.min(100, Math.max(0, Number(playerStats.energy) || 0)) + '%' }"></div>
                            </div>
                            <span class="stat-value">{{ formatCompactNumber(playerStats.energy) }}</span>
                        </div>
                    </div>
                    <!-- 经验进度条 - 横跨整个宽度 -->
                    <div class="exp-progress-bar"
                         v-if="playerStats && playerStats.exp_need"
                         data-tour="level-progress"
                         :class="'level-cap-' + (playerStats.level_breakthrough_state || 'normal')">
                        <span class="exp-level-left">Lv.{{ playerStats.level }}</span>
                        <div class="exp-bar-track">
                            <div class="exp-bar-fill"
                                 role="progressbar"
                                 aria-label="升级经验"
                                 aria-valuemin="0"
                                 :aria-valuemax="playerStats.exp_need || 0"
                                 :aria-valuenow="playerStats.exp || 0"
                                 :style="{ width: getStatPercent(playerStats.exp, playerStats.exp_need) + '%' }"></div>
                        </div>
                        <span class="exp-level-right">
                            {{ playerStats.level_can_progress ? 'Lv.' + (playerStats.level + 1) : '已封顶' }}
                        </span>
                        <button type="button"
                                class="level-cap-badge"
                                :class="playerStats.level_breakthrough_state || 'normal'"
                                :title="playerStats.level_breakthrough_message || '查看等级突破条件'"
                                :aria-label="playerStats.level_breakthrough_message || '查看等级突破条件'"
                                @click="sendQuickCommand('vip_service_list')">
                            {{ playerStats.level_breakthrough_label || '上限120 · VIP每级+20' }}
                        </button>
                    </div>
                </div>
                <div class="header-actions">
                    <!-- 菜单按钮 -->
                    <div class="header-menu-container">
                        <button class="header-btn menu-btn"
                                @click="toggleHeaderMenu"
                                :class="{ active: headerMenuOpen }"
                                :aria-expanded="headerMenuOpen ? 'true' : 'false'"
                                aria-controls="header-menu"
                                aria-label="打开功能菜单"
                                title="菜单">
                            ☰
                        </button>
                        <!-- 弹出菜单 -->
                        <div id="header-menu"
                             class="header-dropdown-menu"
                             v-if="headerMenuOpen"
                             role="menu">
                            <button type="button" class="menu-item" @click="toggleTheme(); headerMenuOpen = false;">
                                <span class="menu-icon">{{ theme === 'classic' ? '🌙' : (theme === 'dark' ? '☀️' : '🏜️') }}</span>
                                <span>{{ theme === 'classic' ? '暗色模式' : (theme === 'dark' ? '浅色模式' : '经典模式') }}</span>
                            </button>
                            <div class="menu-divider"></div>
                            <div class="menu-item language-item">
                                <span class="menu-icon">🌐</span>
                                <select id="vueLanguageSelect" v-model="selectedLanguage" @change="changeLanguage($event)" class="menu-select">
                                    <option value="chinese_simplified">简体中文</option>
                                    <option value="chinese_traditional">繁體中文</option>
                                    <option value="english">English</option>
                                    <option value="japanese">日本語</option>
                                    <option value="korean">한국어</option>
                                    <option value="french">Français</option>
                                    <option value="german">Deutsch</option>
                                    <option value="spanish">Español</option>
                                    <option value="russian">Русский</option>
                                    <option value="portuguese">Português</option>
                                </select>
                            </div>
                            <div class="menu-item font-size-item">
                                <span class="menu-icon" aria-hidden="true">字</span>
                                <select id="vueFontSizeSelect"
                                        v-model="fontSize"
                                        @change="changeFontSize($event)"
                                        class="menu-select"
                                        aria-label="游戏字体大小">
                                    <option value="small">字号：小（默认）</option>
                                    <option value="normal">字号：标准</option>
                                    <option value="large">字号：大</option>
                                    <option value="xlarge">字号：特大</option>
                                </select>
                            </div>
                            <div class="menu-divider"></div>
                            <button type="button" class="menu-item" @click="toggleCombatEffects">
                                <span class="menu-icon">{{ combatEffectsEnabled ? '✨' : '○' }}</span>
                                <span>视觉特效：{{ combatEffectsEnabled ? '开启' : '关闭' }}</span>
                            </button>
                            <button type="button" class="menu-item" @click="toggleSoundEffects">
                                <span class="menu-icon">{{ soundEffectsEnabled ? '🔊' : '🔇' }}</span>
                                <span>游戏音效：{{ soundEffectsEnabled ? '开启' : '关闭' }}</span>
                            </button>
                            <button type="button" class="menu-item" @click="startUiTour">
                                <span class="menu-icon">🧭</span>
                                <span>界面引导</span>
                            </button>
                            <div class="menu-divider"></div>
                            <button type="button" class="menu-item" @click="refreshFrame(); headerMenuOpen = false;">
                                <span class="menu-icon">🔃</span>
                                <span>刷新</span>
                            </button>
                            <button type="button" class="menu-item" @click="showChatModal(); headerMenuOpen = false;">
                                <span class="menu-icon">💬</span>
                                <span>聊天</span>
                            </button>
                            <button type="button" class="menu-item" @click="goToSelection(); headerMenuOpen = false;">
                                <span class="menu-icon">🔄</span>
                                <span>返回选择</span>
                            </button>
                            <div class="menu-divider"></div>
                            <button type="button" class="menu-item" @click="copyBookmarkUrl(); headerMenuOpen = false;">
                                <span class="menu-icon">🔗</span>
                                <span>复制登录链接</span>
                            </button>
                            <button type="button" class="menu-item menu-danger" @click="doLogout(); headerMenuOpen = false;">
                                <span class="menu-icon">🚪</span>
                                <span>退出</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <div ref="uiToastStage" class="ui-toast-stage">
                <div v-if="uiToast"
                     class="ui-toast"
                     :class="'ui-toast-' + uiToast.type"
                     role="status"
                     aria-live="polite">
                    <span class="ui-toast-dot" aria-hidden="true"></span>
                    <span>{{ uiToast.message }}</span>
                    <button v-if="uiToast.actionCommand || uiToast.actionCallback"
                            type="button"
                            class="ui-toast-action"
                            @click="runUiToastAction">{{ uiToast.actionLabel }}</button>
                    <button type="button"
                            class="ui-toast-close"
                            @click="clearUiToast"
                            aria-label="关闭提示">✕</button>
                </div>
            </div>

			<!-- 网页玩家的组队邀请通过状态轮询到达，避免tell_object消息丢失 -->
			<div class="modal-overlay team-invite-overlay" v-if="teamInvite">
				<div class="team-invite-modal"
					 role="dialog"
					 aria-modal="true"
					 aria-labelledby="team-invite-title">
					<div class="team-invite-icon">👥</div>
					<div class="team-invite-kicker">七星阵邀请</div>
					<h3 id="team-invite-title">
						{{ teamInvite.from_name || teamInvite.from }} 邀请你加入队伍
					</h3>
					<p>邀请两分钟内有效；同意后会立即建立或加入对方当前队伍。</p>
					<div class="team-invite-actions">
						<button class="btn btn-secondary"
								:disabled="teamInviteBusy"
								@click="respondTeamInvite(false)">拒绝</button>
						<button class="btn btn-primary"
								:disabled="teamInviteBusy"
								@click="respondTeamInvite(true)">
							{{ teamInviteBusy ? '处理中…' : '同意组队' }}
						</button>
					</div>
				</div>
			</div>

            <!-- 游戏内容: iframe模式 (vue-ui-2) 或 JSON渲染模式 (vue-ui-3) -->
            <main class="game-frame-container"
                  :class="{
                      'battle-dock-active': useJsonMode && isInBattle && !battleFullscreen && !battleDockCollapsed,
                      'battle-dock-collapsed': useJsonMode && isInBattle && !battleFullscreen && battleDockCollapsed
                  }">
                <!-- JSON模式: Vue直接渲染MUD输出 -->
                <div v-if="useJsonMode"
                     class="mud-output-container"
                     data-tour="game-output"
                     :class="{ 'dark-mode': theme === 'dark' }"
                     :aria-busy="mudLoading ? 'true' : 'false'">
                    <div class="mud-parent"
                         :class="{ 'smooth-output-loading': smoothOutputLoading }"
                         v-show="!mudLoading || smoothOutputLoading">
                        <div class="mud-child" ref="mudLinesList">
                            <div v-for="(line, index) in mudLines" :key="getMudLineKey(line, index)" class="mud-line">
                                <!-- 空行 -->
                                <br v-if="line.type === 'empty'">
                                <!-- 内容行 -->
                                <template v-else-if="line.type === 'line'">
                                    <template v-for="(segment, segIndex) in line.segments" :key="segIndex">
                                        <!-- 文本段落 -->
                                        <span v-if="segment.type === 'text'" class="mud-text" v-html="renderTextParts(segment.parts)"></span>
                                        <!-- 图片 [imgurl picture:/images/...] -->
                                        <img v-else-if="segment.type === 'image'"
                                             :src="getImageUrl(segment.src)"
                                             class="mud-inline-image"
                                             :alt="segment.alt || '图片'"
                                             onerror="this.style.display='none'">
                                        <!-- 按钮 -->
                                        <a v-else-if="segment.type === 'button'"
                                           :href="htmlMode ? getDirectUrl(segment.cmd) : '#'"
                                           @click="handleMudButtonClick($event, segment.cmd)"
                                           :class="segment.class"
                                           class="mud-btn"
                                           v-html="segment.label"></a>
                                        <!-- 输入框 -->
                                        <span v-else-if="segment.type === 'input'" class="mud-input-group">
                                            <input :type="segment.isPassword ? 'password' : 'text'"
                                                   :name="segment.name"
                                                   :placeholder="segment.default || ('请输入' + segment.name)"
                                                   :style="segment.width ? 'width:' + segment.width : ''"
                                                   @keyup.enter="submitInput(segment.name, $event)"
                                                   class="mud-input"
                                                   :ref="'input-' + segment.name">
                                            <!-- 不在表单中的输入框显示确定按钮 -->
                                            <a v-if="!segment.inForm"
                                               href="#"
                                               @click.prevent="submitInput(segment.name, $event)"
                                               class="mud-btn mud-confirm-btn">确定</a>
                                        </span>
                                        <!-- 表单提交按钮 (多个输入框共用一个确定按钮) -->
                                        <a v-else-if="segment.type === 'form-submit'"
                                           href="#"
                                           @click.prevent="submitForm(segment)"
                                           :class="segment.class"
                                           class="mud-btn mud-form-submit-btn">{{ segment.label }}</a>
                                        <!-- 命令输入框 -->
                                        <span v-else-if="segment.type === 'cmd-input'" class="mud-cmd-input">
                                            <input type="text"
                                                   :placeholder="'输入' + segment.cmd + '的参数'"
                                                   @keyup.enter="submitCmdInput(segment.cmd, $event)"
                                                   class="mud-input">
                                            <a href="#"
                                               @click.prevent="submitCmdInput(segment.cmd, $event)"
                                               class="mud-btn mud-confirm-btn">确定</a>
                                        </span>
                                        <!-- URL链接 -->
                                        <a v-else-if="segment.type === 'url-link'"
                                           :href="segment.url"
                                           target="_top"
                                           class="mud-btn mud-url">{{ segment.text }}</a>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div v-if="mudLoading && !smoothOutputLoading" class="mud-loading">
                        <div class="spinner"></div>
                        <div>加载中...</div>
                        <div v-if="slowLoadingTip" class="slow-loading-tip">数据量较大，请耐心等待...</div>
                    </div>
                </div>

                <!-- iframe模式: 显示原始HTML -->
                <iframe
                    v-else
                    ref="gameFrame"
                    :src="gameFrameUrl"
                    class="game-frame"
                    @load="onFrameLoad"
                    sandbox="allow-same-origin allow-scripts allow-forms">
                </iframe>
                <div v-if="!useJsonMode && frameLoading" class="frame-loading">
                    <div class="spinner"></div>
                    <div>加载中...</div>
                </div>
            </main>

            <!-- 战斗面板 (JSON模式专用) -->
            <div v-if="useJsonMode && isInBattle"
                 class="battle-panel"
                 :class="{ 'mini-mode': !battleFullscreen, 'fullscreen-mode': battleFullscreen, 'dock-collapsed': !battleFullscreen && battleDockCollapsed }"
                 aria-live="polite">
                <!-- 共用技能动画层：迷你停靠栏和战斗详情都能看到，不遮挡点击。 -->
                <div v-if="combatEffectsEnabled && skillAnimations.length && (!battleDockCollapsed || battleFullscreen)"
                     class="battle-skill-stage"
                     aria-hidden="true">
                    <div v-for="skill in skillAnimations"
                         :key="skill.id"
                         class="skill-effect-container"
                         :class="'skill-target-' + (skill.target || 'enemy')">
                        <div class="skill-effect" :class="getSkillAnimationClass(skill.type)">
                            <span :class="getSkillIconClass(skill.type)">{{ getSkillIcon(skill.type) }}</span>
                        </div>
                        <span v-if="skill.name" class="skill-effect-label">{{ skill.name }}</span>
                    </div>
                </div>
                <button v-if="!battleFullscreen && battleDockCollapsed"
                        type="button"
                        class="battle-dock-trigger"
                        @click="toggleBattleDock"
                        :title="'展开战斗状态：' + (battleEnemy?.name || '目标识别中')"
                        aria-label="展开战斗状态">
                    <span aria-hidden="true">⚔️</span>
                    <span class="battle-dock-percent">{{ getStatPercent(battleEnemy?.hp, battleEnemy?.hpMax) }}%</span>
                </button>
                <!-- 迷你模式: 显示敌我核心战斗数据 -->
                <div v-if="!battleFullscreen && !battleDockCollapsed" class="battle-mini">
                    <div class="battle-side player-side">
                        <div class="battle-identity">
                            <span class="battle-name">{{ battlePlayerFull?.name_cn || playerStats?.name_cn || loginForm.userid }}</span>
                            <span class="battle-level">Lv.{{ battlePlayerFull?.level ?? playerStats?.level ?? 0 }}</span>
                        </div>
                        <div class="battle-resource-row">
                            <span class="battle-resource-label hp-label">生命</span>
                            <div class="hp-bar-container">
                                <div class="hp-bar-fill player-hp" :style="{ width: getStatPercent(battlePlayerFull?.hp ?? playerStats?.hp, battlePlayerFull?.hp_max ?? playerStats?.hp_max) + '%' }"></div>
                            </div>
                            <span class="hp-text" :title="(battlePlayerFull?.hp ?? playerStats?.hp ?? 0) + '/' + (battlePlayerFull?.hp_max ?? playerStats?.hp_max ?? 0)">
                                {{ formatCompactNumber(battlePlayerFull?.hp ?? playerStats?.hp ?? 0) }}/{{ formatCompactNumber(battlePlayerFull?.hp_max ?? playerStats?.hp_max ?? 0) }}
                            </span>
                        </div>
                        <div class="battle-resource-row">
                            <span class="battle-resource-label mana-label">法力</span>
                            <div class="neili-bar-container">
                                <div class="neili-bar-fill player-neili" :style="{ width: getStatPercent(battlePlayerFull?.mana ?? playerStats?.mana, battlePlayerFull?.mana_max ?? playerStats?.mana_max) + '%' }"></div>
                            </div>
                            <span class="neili-text" :title="(battlePlayerFull?.mana ?? playerStats?.mana ?? 0) + '/' + (battlePlayerFull?.mana_max ?? playerStats?.mana_max ?? 0)">
                                {{ formatCompactNumber(battlePlayerFull?.mana ?? playerStats?.mana ?? 0) }}/{{ formatCompactNumber(battlePlayerFull?.mana_max ?? playerStats?.mana_max ?? 0) }}
                            </span>
                        </div>
                        <div class="battle-meta">
                            <span>{{ battlePlayerFull?.profe || playerStats?.profe || '职业未知' }}</span>
                            <span>{{ battlePlayerFull?.race || playerStats?.race || '阵营未知' }}</span>
                        </div>
                        <div class="battle-guard-status"
                             v-if="(battlePlayerFull?.guard_active ?? playerStats?.guard_active)">
                            <span aria-hidden="true">🛡</span>
                            <span>山河壁 {{ formatCompactNumber(battlePlayerFull?.guard ?? playerStats?.guard ?? 0) }}</span>
                            <span>· {{ battlePlayerFull?.guard_time ?? playerStats?.guard_time ?? 0 }}秒</span>
                        </div>
                    </div>
                    <div class="battle-vs">⚔️</div>
                    <div class="battle-side enemy-side">
                        <div class="battle-identity">
                            <span class="battle-name">{{ battleEnemy?.name || '目标识别中' }}</span>
                            <span class="battle-level" v-if="battleEnemy?.level !== undefined">Lv.{{ battleEnemy.level }}</span>
                        </div>
                        <div class="battle-resource-row">
                            <span class="battle-resource-label hp-label">生命</span>
                            <div class="hp-bar-container">
                                <div class="hp-bar-fill enemy-hp" :style="{ width: getStatPercent(battleEnemy?.hp, battleEnemy?.hpMax) + '%' }"></div>
                            </div>
                            <span class="hp-text" :title="(battleEnemy?.hp ?? '?') + '/' + (battleEnemy?.hpMax ?? '?')">
                                {{ battleEnemy ? formatCompactNumber(battleEnemy.hp) : '?' }}/{{ battleEnemy ? formatCompactNumber(battleEnemy.hpMax) : '?' }}
                            </span>
                        </div>
                        <div class="battle-meta">
                            <span>{{ battleEnemy?.profe || '怪物' }}</span>
                            <span v-if="battleEnemy?.race">{{ battleEnemy.race }}</span>
                        </div>
                        <div class="battle-meta battle-power" v-if="battleEnemy?.attack !== undefined || battleEnemy?.defend !== undefined">
                            <span>攻 {{ formatCompactNumber(battleEnemy?.attackLow ?? battleEnemy?.attack ?? 0) }}<template v-if="battleEnemy?.attackHigh !== undefined && battleEnemy.attackHigh !== battleEnemy.attackLow">-{{ formatCompactNumber(battleEnemy.attackHigh) }}</template></span>
                            <span>防 {{ formatCompactNumber(battleEnemy?.defend ?? 0) }}</span>
                        </div>
                    </div>
                    <div class="battle-mini-controls">
                        <button type="button"
                                class="battle-collapse-btn"
                                @click="toggleBattleDock"
                                title="收起到屏幕边缘"
                                aria-label="收起战斗状态">›</button>
                        <button type="button"
                                class="battle-toggle-btn"
                                @click="toggleBattleFullscreen"
                                title="打开战斗详情"
                                aria-label="打开战斗详情">☰</button>
                    </div>
                </div>

                <!-- 全屏模式: 上下布局显示敌我双方 -->
                <div v-if="battleFullscreen" class="battle-full">
                    <div class="battle-header">
                        <h4>⚔️ 战斗中</h4>
                        <div class="battle-controls">
                            <button class="battle-control-btn"
                                    @click="toggleCombatEffects"
                                    :class="{ active: combatEffectsEnabled }"
                                    :title="combatEffectsEnabled ? '关闭技能动画' : '开启技能动画'"
                                    :aria-label="combatEffectsEnabled ? '关闭技能动画' : '开启技能动画'">✨</button>
                            <button class="battle-control-btn" @click="toggleBattleLog" :class="{ active: battleShowLog }" title="战斗日志">📜</button>
                            <button class="battle-control-btn" @click="toggleBattleFullscreen" title="迷你模式">━</button>
                        </div>
                    </div>

                                <div class="combatant-row-left">
                                    <span class="combatant-avatar">{{ battleEnemy?.is_npc ? '👹' : '⚔️' }}</span>
                                    <span class="combatant-name enemy-name">{{ battleEnemy?.name || '目标识别中' }}</span>
                                    <span class="battle-level" v-if="battleEnemy?.level !== undefined">Lv.{{ battleEnemy.level }}</span>
                                </div>
                                <span class="hp-text-small">{{ formatCompactNumber(battleEnemy?.hp ?? 0) }}/{{ formatCompactNumber(battleEnemy?.hpMax ?? 0) }}</span>
                            </div>
                            <div class="hp-bar-wrapper-vertical">
                                <div class="hp-bar-track-vertical">
                                    <div class="hp-bar-fill enemy-hp" :style="{ width: getStatPercent(battleEnemy?.hp, battleEnemy?.hpMax) + '%' }"></div>
                                </div>
                            </div>
                            <div class="combatant-stats enemy-detail-stats" v-if="battleEnemyFull">
                                <span class="stat-item">职业: {{ battleEnemyFull.profe || '怪物' }}</span>
                                <span class="stat-item" v-if="battleEnemyFull.race">阵营: {{ battleEnemyFull.race }}</span>
                                <span class="stat-item">攻击: {{ formatCompactNumber(battleEnemyFull.attack_low ?? battleEnemyFull.attack ?? 0) }}<template v-if="battleEnemyFull.attack_high !== undefined && battleEnemyFull.attack_high !== battleEnemyFull.attack_low">-{{ formatCompactNumber(battleEnemyFull.attack_high) }}</template></span>
                                <span class="stat-item">防御: {{ formatCompactNumber(battleEnemyFull.defend || 0) }}</span>
                            </div>
                        </div>

                        <!-- 战斗VS标志 + 伤害数字动画层 -->
                        <div class="battle-center-area">
                            <div class="battle-vs-vertical">⚔️</div>
                            <!-- 伤害数字动画 -->
                            <div class="battle-animation-layer">
                                <div v-for="anim in battleAnimations" :key="anim.id" class="battle-animation" :class="getAnimationClass(anim)">
                                    <span class="animation-value" :class="{ 'critical': anim.isCritical }">
                                        {{ anim.type === 'heal' ? '+' : '-' }}{{ anim.value }}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- 玩家（下方） -->
                        <div class="combatant-vertical player-combatant" :class="{ 'damage-flash': hasDamageAnimation('player') }">
                            <div class="combatant-row">
                                <div class="combatant-row-left">
                                    <span class="combatant-avatar">👤</span>
                                    <span class="combatant-name player-name">{{ battlePlayerFull?.name_cn || playerStats?.name_cn || loginForm.userid }}</span>
                                    <span class="battle-level">Lv.{{ battlePlayerFull?.level ?? playerStats?.level ?? 0 }}</span>
                                </div>
                                <span class="hp-text-small">{{ formatCompactNumber(battlePlayerFull?.hp ?? playerStats?.hp ?? 0) }}/{{ formatCompactNumber(battlePlayerFull?.hp_max ?? playerStats?.hp_max ?? 0) }}</span>
                            </div>
                            <div class="hp-bar-wrapper-vertical">
                                <div class="hp-bar-track-vertical">
                                    <div class="hp-bar-fill player-hp" :style="{ width: getStatPercent(battlePlayerFull?.hp ?? playerStats?.hp, battlePlayerFull?.hp_max ?? playerStats?.hp_max) + '%' }"></div>
                                </div>
                            </div>
                            <!-- 法力条 -->
                            <div class="neili-bar-wrapper-vertical">
                                <div class="neili-bar-track-vertical">
                                    <div class="neili-bar-fill player-neili" :style="{ width: getStatPercent(battlePlayerFull?.mana ?? playerStats?.mana, battlePlayerFull?.mana_max ?? playerStats?.mana_max) + '%' }"></div>
                                </div>
                            </div>
                            <div class="combatant-stats player-detail-stats" v-if="battlePlayerFull">
                                <span class="stat-item">法力: {{ formatCompactNumber(battlePlayerFull.mana || 0) }}/{{ formatCompactNumber(battlePlayerFull.mana_max || 0) }}</span>
                                <span class="stat-item">精力: {{ formatCompactNumber(battlePlayerFull.energy || 0) }}</span>
                                <span class="stat-item">职业: {{ battlePlayerFull.profe || '未知' }}</span>
                                <span class="stat-item">阵营: {{ battlePlayerFull.race || '未知' }}</span>
                                <span class="stat-item guard-stat" v-if="battlePlayerFull.guard_active">🛡 山河壁: {{ formatCompactNumber(battlePlayerFull.guard || 0) }} · {{ battlePlayerFull.guard_time || 0 }}秒</span>
                            </div>
                        </div>
                    </div>

                    <!-- 战斗操作按钮 (全屏模式显示) -->
                    <div class="battle-actions" v-if="battleFullscreen && !showPerformsList">
                        <button class="battle-action-btn" @click="sendJsonCommand('attack')">
                            ⚔️ 察看战况
                        </button>
                        <button class="battle-action-btn" @click="openPerformsList">
                            ✨ 特殊攻击
                        </button>
                        <button class="battle-action-btn warning" @click="sendJsonCommand('surrender')">
                            🏳️ 投降
                        </button>
                        <button class="battle-action-btn danger" @click="sendJsonCommand('escape')">
                            🏃 逃跑
                        </button>
                    </div>

                    <!-- 招式列表 (全屏模式显示) -->
                    <div class="battle-actions" v-if="battleFullscreen && showPerformsList">
                        <div class="performs-header">
                            <button class="battle-action-btn back-btn" @click="closePerformsList">
                                ← 返回
                            </button>
                            <span class="performs-title">{{ performsData?.skill_name_cn || '招式列表' }}</span>
                            <span class="performs-subtitle">Lv.{{ performsData?.skill_level || 0 }}</span>
                        </div>
                        <div class="performs-list" v-if="performsData?.performs?.length > 0">
                            <button
                                v-for="perform in performsData.performs"
                                :key="perform.id"
                                class="perform-item"
                                :class="{ 'disabled': !perform.available || !perform.enough_neili }"
                                @click="selectPerform(perform)"
                            >
                                <span class="perform-name">{{ perform.name_cn }}</span>
                                <span class="perform-cost" v-if="perform.neili_cost > 0">
                                    ⚡ {{ perform.neili_cost }}
                                </span>
                                <span class="perform-req" v-if="perform.level_req > 0">
                                    需Lv.{{ perform.level_req }}
                                </span>
                            </button>
                        </div>
                        <div class="performs-empty" v-else>
                            {{ performsData?.message || '暂无可用招式' }}
                        </div>
                    </div>

                    <!-- 战斗日志 -->
                    <div v-if="battleShowLog" class="battle-log-panel">
                        <div class="battle-log-header">
                            <span>战斗日志</span>
                            <button class="battle-log-clear" @click="clearBattleLog">清空</button>
                        </div>
                        <div class="battle-log-list">
                            <div v-for="(log, index) in battleLog" :key="index" class="battle-log-item" :class="'log-' + log.type">
                                <span class="log-time">{{ log.timestamp }}</span>
                                <span class="log-message">{{ log.message }}</span>
                            </div>
                            <div v-if="battleLog.length === 0" class="battle-log-empty">暂无战斗记录</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 新手任务完成弹窗：持久舞台供 AutoAnimate 平滑切换队列 -->
            <div ref="newbieCompletionStage" class="newbie-completion-stage">
              <div class="modal-overlay newbie-completion-overlay"
                   v-if="activeNewbieCompletion">
                <div class="newbie-completion-modal"
                     role="dialog"
                     aria-modal="true"
                     aria-labelledby="newbie-completion-title"
                     :class="{ 'reward-pending': activeNewbieCompletion.code === 4 }">
                    <button class="newbie-completion-close"
                            @click="dismissNewbieCompletions"
                            aria-label="关闭">✕</button>
                    <div class="newbie-completion-icon">
                        {{ activeNewbieCompletion.code === 4 ? '🎒' : '✨' }}
                    </div>
                    <div class="newbie-completion-kicker">
                        {{ activeNewbieCompletion.code === 4
                            ? '奖励待领取'
                            : '新手任务完成' }}
                    </div>
                    <div class="newbie-completion-progress"
                         v-if="activeNewbieCompletion.code === 2">
                        第 {{ activeNewbieCompletion.step }} /
                        {{ activeNewbieCompletion.total }} 步
                    </div>
                    <h3 id="newbie-completion-title">
                        {{ activeNewbieCompletion.title }}
                    </h3>
                    <div class="newbie-completion-reward">
                        <span>🎁</span>
                        <span>{{ activeNewbieCompletion.reward }}</span>
                    </div>
                    <div class="newbie-completion-next"
                         v-if="activeNewbieCompletion.code === 4">
                        请先腾出背包空位；整理后再执行任一引导操作，系统会自动补发。
                    </div>
                    <div class="newbie-completion-next"
                         v-if="activeNewbieCompletion.code === 2">
                        <template v-if="activeNewbieCompletion.complete">
                            恭喜，你已经完成全部新手课程！
                        </template>
                        <template v-else>
                            下一步：{{ activeNewbieCompletion.next_title }}
                            <small>{{ activeNewbieCompletion.next_desc }}</small>
                        </template>
                    </div>
                    <div class="newbie-completion-actions">
                        <button class="btn btn-secondary"
                                @click="dismissNewbieCompletions">
                            留在当前界面
                        </button>
                        <button class="btn btn-primary"
                                @click="continueNewbieGuide">
                            {{ getNewbieCompletionPrimaryLabel() }}
                        </button>
                    </div>
                </div>
              </div>
            </div>

            <!-- 命令输入弹窗 -->
            <div class="modal-overlay" v-if="showCommandInput" @click.self="showCommandInput = false">
                <div class="modal command-modal">
                    <h3>发送命令</h3>
                    <input
                        type="text"
                        v-model="commandInput"
                        @keyup.enter="sendCommand"
                        placeholder="输入命令..."
                        class="command-input"
                        ref="commandInputRef"
                    >
                    <div class="command-buttons">
                        <button class="btn btn-secondary" @click="showCommandInput = false">取消</button>
                        <button class="btn btn-primary" @click="sendCommand">发送</button>
                    </div>
                </div>
            </div>

            <!-- 聊天室视图 -->
            <div class="modal-overlay" v-if="showChatRoom" @click.self="closeChatRoom">
                <div class="chat-room">
                    <div class="chat-room-header">
                        <h3>💬 公共聊天室</h3>
                        <button class="chat-close-btn" @click="closeChatRoom">✕</button>
                    </div>
                    <div class="chat-messages" ref="chatMessagesContainer">
                        <div v-if="chatMessages.length === 0" class="chat-empty">暂无消息</div>
                        <div v-for="(msg, index) in chatMessages" :key="index" class="chat-message" v-html="parseChatLinks(msg)">
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input
                            type="text"
                            v-model="chatInput"
                            @keyup.enter="sendChat"
                            placeholder="输入消息..."
                            class="chat-input"
                            ref="chatInputRef"
                        >
                        <button class="btn btn-primary chat-send-btn" @click="sendChat">发送</button>
                    </div>
                </div>
            </div>

            <!-- 邀请好友弹窗 -->
            <div class="modal-overlay" v-if="showInviteModal" @click.self="closeInviteModal">
                <div class="invite-modal">
                    <div class="invite-modal-header">
                        <h3>👥 邀请好友</h3>
                        <button class="chat-close-btn" @click="closeInviteModal">✕</button>
                    </div>
                    <div class="invite-modal-body">
                        <p class="invite-desc">通过邀请链接注册的玩家充值后，您将获得天下点奖励！</p>

                        <div class="invite-section">
                            <label class="invite-label">您的邀请码：</label>
                            <div class="invite-code-box">
                                <span class="invite-code-text">{{ inviteCode || username }}</span>
                                <button class="copy-btn" @click="copyInviteCode">复制</button>
                            </div>
                        </div>

                        <div class="invite-section">
                            <label class="invite-label">邀请链接：</label>
                            <div class="invite-link-box">
                                <span class="invite-link-text">{{ inviteLink }}</span>
                                <button class="copy-btn" @click="copyInviteLink">复制</button>
                            </div>
                        </div>

                        <div class="invite-qr-section">
                            <label class="invite-label">扫码邀请：</label>
                            <div class="qr-code-container">
                                <img :src="qrCodeUrl" alt="邀请二维码" class="qr-code-img">
                            </div>
                        </div>

                        <div class="invite-rules">
                            <p class="rules-title">🎁 奖励规则</p>
                            <p>每推荐 <strong>4</strong> 人充值，获得 <strong>5000</strong> 天下点！</p>
                        </div>

                        <div class="invite-stats">
                            <button class="stats-btn" @click="viewInviteStats">查看邀请统计</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 快捷命令栏 -->
            <footer class="quick-actions"
                    :class="{ collapsed: quickActionsCollapsed }"
                    aria-label="快捷导航">
                <div class="quick-more-panel"
                     id="quick-more-panel"
                     v-show="!quickActionsCollapsed">
                    <div class="quick-more-heading">
                        <div>
                            <span class="quick-more-eyebrow">常用功能</span>
                            <strong>探索与成长</strong>
                        </div>
                        <button type="button"
                                class="quick-panel-close"
                                @click="toggleQuickActions"
                                aria-label="收起更多功能">✕</button>
                    </div>

    <script type="module">
    import { autoAnimate } from './vendor/auto-animate.min.js?v=v1785611025462';
    window.XiandAutoAnimate = autoAnimate;
    window.dispatchEvent(new CustomEvent('xiand:auto-animate-ready'));

    <script src="js/app.js?v=v1785611025462"></script>
    <!-- 翻译插件 - 立即执行初始化 -->
    <script src="../includes/translate.js?v=v1785611025462"></script>
    <script>
    // 翻译初始化
    translate.service.use('client.edge');

    // 启动时直接恢复目标语言，不调用 changeLanguage。
    // translate.js 的 changeLanguage 会在已有目标语言时 reload；
    // 手机浏览器保存非中文语言后，启动时重复调用会形成无限刷新。
    var supportedLanguages = [
        'chinese_simplified',
        'chinese_traditional',
        'english',
        'japanese',
        'korean',
        'french',
        'german',
        'spanish',
        'russian',
        'portuguese'
    ];
    var savedLang = localStorage.getItem('userLanguage') || 'chinese_simplified';
    if (supportedLanguages.indexOf(savedLang) === -1) {
        savedLang = 'chinese_simplified';
    }
    localStorage.setItem('userLanguage', savedLang);

    translate.language.setLocal('chinese_simplified');
    if (savedLang === 'chinese_simplified') {
        translate.to = '';
        translate.storage.set('to', '');
    } else {
        translate.to = savedLang;
        translate.storage.set('to', savedLang);
    }
    translate.execute();

    if (window.vueInstance) {
        window.vueInstance.selectedLanguage = savedLang;
    }
    console.log('[Translate] Restored language without reload:', savedLang);

    // Vue外层语言切换函数
    window.changeVueLanguage = function(lang) {
        console.log('[Translate] changeVueLanguage called with:', lang);
        if (typeof translate !== 'undefined' && translate.changeLanguage) {
            // 保存用户选择
            localStorage.setItem('userLanguage', lang);
            translate.changeLanguage(lang);
            // 同步到iframe
            const iframe = document.querySelector('.game-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({type: 'changeLanguage', lang: lang}, '*');
            }
        } else {
            console.error('[Translate] translate not available');
        }
    };

    // 监听iframe的postMessage
    window.addEventListener('message', function(event) {
        if (event.data.type === 'changeLanguage') {
            if (typeof translate !== 'undefined' && translate.changeLanguage) {
                if (localStorage.getItem('userLanguage') === event.data.lang) {
                    return;
                }
                console.log('[Translate] Received language change from iframe:', event.data.lang);
                localStorage.setItem('userLanguage', event.data.lang);
                translate.changeLanguage(event.data.lang);
            }
        }
    });

    // 页面加载后，同步语言选择器的值
    window.addEventListener('load', function() {
        var savedLang = localStorage.getItem('userLanguage');
        if (savedLang) {
            var select = document.getElementById('vueLanguageSelect');
            if (select) {
                select.value = savedLang;
                console.log('[Translate] Set select to:', savedLang);
            }
        }
    });
    </script>
